name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      # npm 12 honors package.json's allowScripts (keeps better-sqlite3 on
      # its prebuilt binary); npm 11 would try to compile it.
      - run: npm install -g npm@12
      - run: npm ci
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t ausschnitt:ci .
