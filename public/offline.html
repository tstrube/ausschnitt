            text-align: center;
        }
        @media (prefers-color-scheme: dark) {
            body { background: #212529; color: #dee2e6; }
        }
        img { width: 64px; height: 64px; margin-bottom: 1rem; }
        h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
        p { margin: 0 0 1.25rem; opacity: .8; }
        button {
            font: inherit;
            padding: .5rem 1.25rem;

            border: 0;
            background: #0d6efd;
            color: #fff;
        }
    </style>
</head>
